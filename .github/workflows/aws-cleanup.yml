name: AWS Cleanup - BirthdayHelper

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove the project-specific AWS IAM role'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  TARGET_ROLE: github-oidc-birthdayhelper

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        run: |
          if [[ "${{ inputs.confirm }}" != "DELETE" ]]; then
            echo "::error::Confirmation must be exactly DELETE"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify account and project resources are already gone
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "${ACTUAL_ACCOUNT}" != "${AWS_ACCOUNT_ID}" ]]; then
            echo "::error::Unexpected AWS account: ${ACTUAL_ACCOUNT}"
            exit 1
          fi

          echo "AWS account verified: ${ACTUAL_ACCOUNT}"

          if aws cloudformation describe-stacks --region "${AWS_REGION}" --stack-name BirthdayBotStack >/dev/null 2>&1; then
            echo "::error::BirthdayBotStack still exists. Cleanup is intentionally refusing to delete the IAM role."
            exit 1
          fi

          INSTANCE_COUNT="$(aws ec2 describe-instances --region "${AWS_REGION}" --filters "Name=tag:Service,Values=birthday-bot" --query 'length(Reservations[].Instances[])' --output text)"
          VOLUME_COUNT="$(aws ec2 describe-volumes --region "${AWS_REGION}" --filters "Name=tag:Service,Values=birthday-bot" --query 'length(Volumes[])' --output text)"
          SECRET_COUNT="$(aws secretsmanager list-secrets --region "${AWS_REGION}" --query "length(SecretList[?starts_with(Name, 'birthday-bot/')])" --output text)"
          SSM_COUNT="$(aws ssm get-parameters-by-path --region "${AWS_REGION}" --path "/birthday-bot" --recursive --query 'length(Parameters[])' --output text)"

          echo "BirthdayHelper EC2 instances: ${INSTANCE_COUNT}"
          echo "BirthdayHelper EBS volumes: ${VOLUME_COUNT}"
          echo "BirthdayHelper Secrets Manager secrets: ${SECRET_COUNT}"
          echo "BirthdayHelper SSM parameters: ${SSM_COUNT}"

          if [[ "${INSTANCE_COUNT}" != "0" || "${VOLUME_COUNT}" != "0" || "${SECRET_COUNT}" != "0" || "${SSM_COUNT}" != "0" ]]; then
            echo "::error::Unexpected BirthdayHelper resources still exist. Refusing IAM cleanup."
            exit 1
          fi

      - name: Delete project-specific GitHub OIDC IAM role
        shell: bash
        run: |
          set -euo pipefail

          if ! aws iam get-role --role-name "${TARGET_ROLE}" >/dev/null 2>&1; then
            echo "Role ${TARGET_ROLE} is already absent."
            exit 0
          fi

          echo "Deleting attached managed policies..."
          mapfile -t ATTACHED < <(aws iam list-attached-role-policies --role-name "${TARGET_ROLE}" --query 'AttachedPolicies[].PolicyArn' --output text | tr '\t' '\n' | sed '/^$/d')
          for POLICY_ARN in "${ATTACHED[@]}"; do
            echo "Detaching ${POLICY_ARN}"
            aws iam detach-role-policy --role-name "${TARGET_ROLE}" --policy-arn "${POLICY_ARN}"
          done

          echo "Deleting inline policies..."
          mapfile -t INLINE < <(aws iam list-role-policies --role-name "${TARGET_ROLE}" --query 'PolicyNames[]' --output text | tr '\t' '\n' | sed '/^$/d')
          for POLICY_NAME in "${INLINE[@]}"; do
            echo "Deleting inline policy ${POLICY_NAME}"
            aws iam delete-role-policy --role-name "${TARGET_ROLE}" --policy-name "${POLICY_NAME}"
          done

          echo "Removing role from instance profiles, if any..."
          mapfile -t PROFILES < <(aws iam list-instance-profiles-for-role --role-name "${TARGET_ROLE}" --query 'InstanceProfiles[].InstanceProfileName' --output text | tr '\t' '\n' | sed '/^$/d')
          for PROFILE in "${PROFILES[@]}"; do
            echo "Removing from instance profile ${PROFILE}"
            aws iam remove-role-from-instance-profile --instance-profile-name "${PROFILE}" --role-name "${TARGET_ROLE}"
          done

          BOUNDARY_ARN="$(aws iam get-role --role-name "${TARGET_ROLE}" --query 'Role.PermissionsBoundary.PermissionsBoundaryArn' --output text 2>/dev/null || true)"
          if [[ -n "${BOUNDARY_ARN}" && "${BOUNDARY_ARN}" != "None" ]]; then
            echo "Removing permissions boundary"
            aws iam delete-role-permissions-boundary --role-name "${TARGET_ROLE}"
          fi

          echo "Deleting IAM role ${TARGET_ROLE}..."
          aws iam delete-role --role-name "${TARGET_ROLE}"

          if aws iam get-role --role-name "${TARGET_ROLE}" >/dev/null 2>&1; then
            echo "::error::Role still exists after delete request."
            exit 1
          fi

          echo "Deleted IAM role: ${TARGET_ROLE}"

      - name: Shared AWS resources intentionally retained
        run: |
          echo "BirthdayHelper-specific AWS runtime resources are gone."
          echo "CDKToolkit and its bootstrap S3 bucket were NOT deleted because they are account/region shared infrastructure."
          echo "The AWS GitHub OIDC provider was NOT deleted because it can be shared by other repositories."
