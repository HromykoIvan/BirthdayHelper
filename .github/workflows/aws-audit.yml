name: AWS Audit - BirthdayHelper (read only)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  ECR_REPO: ${{ vars.ECR_REPO }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          set -e
          aws sts get-caller-identity
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "${ACTUAL_ACCOUNT}" = "${AWS_ACCOUNT_ID}"

      - name: Audit BirthdayHelper AWS resources
        shell: bash
        run: |
          set +e
          section() { echo; echo "================ $1 ================"; }

          section "CloudFormation BirthdayBotStack"
          aws cloudformation describe-stacks --region "${AWS_REGION}" --stack-name BirthdayBotStack             --query 'Stacks[0].{Name:StackName,Status:StackStatus,Created:CreationTime,Updated:LastUpdatedTime}' --output table 2>&1             || echo "BirthdayBotStack: not found or not readable"

          echo "--- Stack resources ---"
          aws cloudformation describe-stack-resources --region "${AWS_REGION}" --stack-name BirthdayBotStack             --query 'StackResources[].{Logical:LogicalResourceId,Type:ResourceType,Physical:PhysicalResourceId,Status:ResourceStatus}' --output table 2>&1 || true

          section "EC2 instances tagged Service=birthday-bot"
          aws ec2 describe-instances --region "${AWS_REGION}" --filters "Name=tag:Service,Values=birthday-bot"             --query 'Reservations[].Instances[].{Id:InstanceId,State:State.Name,Type:InstanceType,PublicIp:PublicIpAddress,PrivateIp:PrivateIpAddress,Name:Tags[?Key==`Name`]|[0].Value}' --output table 2>&1 || true

          section "EBS volumes tagged Service=birthday-bot"
          aws ec2 describe-volumes --region "${AWS_REGION}" --filters "Name=tag:Service,Values=birthday-bot"             --query 'Volumes[].{Id:VolumeId,State:State,SizeGiB:Size,Type:VolumeType,Az:AvailabilityZone}' --output table 2>&1 || true

          section "Elastic IPs"
          aws ec2 describe-addresses --region "${AWS_REGION}"             --query 'Addresses[].{PublicIp:PublicIp,AllocationId:AllocationId,AssociationId:AssociationId,InstanceId:InstanceId,Name:Tags[?Key==`Name`]|[0].Value,Service:Tags[?Key==`Service`]|[0].Value}' --output table 2>&1 || true

          section "Auto Scaling Groups matching birthday"
          aws autoscaling describe-auto-scaling-groups --region "${AWS_REGION}"             --query "AutoScalingGroups[?contains(AutoScalingGroupName, 'Birthday') || contains(AutoScalingGroupName, 'birthday')].{Name:AutoScalingGroupName,Min:MinSize,Max:MaxSize,Desired:DesiredCapacity,Instances:length(Instances)}" --output table 2>&1 || true

          section "Launch Templates matching birthday"
          aws ec2 describe-launch-templates --region "${AWS_REGION}"             --query "LaunchTemplates[?contains(LaunchTemplateName, 'Birthday') || contains(LaunchTemplateName, 'birthday')].{Id:LaunchTemplateId,Name:LaunchTemplateName,Latest:LatestVersionNumber,Default:DefaultVersionNumber}" --output table 2>&1 || true

          section "Security Groups related to BirthdayBot/Caddy"
          aws ec2 describe-security-groups --region "${AWS_REGION}"             --query "SecurityGroups[?contains(GroupName, 'Birthday') || contains(GroupName, 'birthday') || contains(Description, 'Caddy')].{Id:GroupId,Name:GroupName,Vpc:VpcId,Description:Description}" --output table 2>&1 || true

          section "ECR repository"
          aws ecr describe-repositories --region "${AWS_REGION}" --repository-names "${ECR_REPO}"             --query 'repositories[].{Name:repositoryName,Uri:repositoryUri,Created:createdAt}' --output table 2>&1             || echo "ECR repository ${ECR_REPO}: not found or not readable"
          aws ecr describe-images --region "${AWS_REGION}" --repository-name "${ECR_REPO}"             --query '{ImageCount:length(imageDetails),TotalBytes:sum(imageDetails[].imageSizeInBytes)}' --output table 2>&1 || true

          section "Secrets Manager birthday-bot/*"
          aws secretsmanager list-secrets --region "${AWS_REGION}"             --query "SecretList[?starts_with(Name, 'birthday-bot/')].{Name:Name,ARN:ARN,LastChanged:LastChangedDate}" --output table 2>&1 || true

          section "SSM parameters /birthday-bot"
          aws ssm get-parameters-by-path --region "${AWS_REGION}" --path "/birthday-bot" --recursive             --query 'Parameters[].{Name:Name,Type:Type,Version:Version,Modified:LastModifiedDate}' --output table 2>&1 || true

          section "IAM roles matching BirthdayBot/birthday"
          aws iam list-roles             --query "Roles[?contains(RoleName, 'BirthdayBot') || contains(RoleName, 'birthday')].{Name:RoleName,Arn:Arn,Created:CreateDate}" --output table 2>&1 || true

          section "IAM instance profiles matching BirthdayBot/birthday"
          aws iam list-instance-profiles             --query "InstanceProfiles[?contains(InstanceProfileName, 'BirthdayBot') || contains(InstanceProfileName, 'birthday')].{Name:InstanceProfileName,Arn:Arn,Created:CreateDate}" --output table 2>&1 || true

          section "CloudWatch log groups matching birthday"
          aws logs describe-log-groups --region "${AWS_REGION}"             --query "logGroups[?contains(logGroupName, 'birthday') || contains(logGroupName, 'Birthday')].{Name:logGroupName,StoredBytes:storedBytes,Retention:retentionInDays}" --output table 2>&1 || true

          section "CDK bootstrap stack"
          aws cloudformation describe-stacks --region "${AWS_REGION}" --stack-name CDKToolkit             --query 'Stacks[0].{Name:StackName,Status:StackStatus,Created:CreationTime}' --output table 2>&1             || echo "CDKToolkit: not found or not readable"

          section "CDK bootstrap asset bucket - audit only"
          CDK_BUCKET="cdk-hnb659fds-assets-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          echo "Expected bucket: ${CDK_BUCKET}"
          aws s3api head-bucket --bucket "${CDK_BUCKET}" 2>/dev/null && echo "Exists" || echo "Not found / not readable"

          section "Audit complete"
          echo "READ-ONLY audit only. No AWS resources were changed."
