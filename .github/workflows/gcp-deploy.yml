name: Deploy BirthdayHelper to Google Cloud Run

on:
  push:
    branches: [ master ]
    paths:
      - "backend/**"
      - "Dockerfile"
      - "nuget.config"
      - ".github/workflows/gcp-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: birthday-helper-production
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: birthdayhelper-511100
  GCP_REGION: europe-central2
  ARTIFACT_REPOSITORY: birthday-helper
  CLOUD_RUN_SERVICE: birthday-helper
  IMAGE_NAME: birthday-helper
  RUNTIME_SERVICE_ACCOUNT: birthday-helper-runtime@birthdayhelper-511100.iam.gserviceaccount.com
  SCHEDULER_JOB: birthday-helper-reminders

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@birthdayhelper-511100.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: docker build --platform linux/amd64 -f Dockerfile -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" .

      - name: Push container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: |-
            ASPNETCORE_ENVIRONMENT=Production
            Mongo__Database=birthdaybot
            Reminder__RunAsHostedService=false
            LocalAi__Enable=false
            Metrics__Enable=false
            OpenAi__Enable=true
            OpenAi__IntentModel=gpt-6-luna
            OpenAi__GreetingModel=gpt-6-luna
            OpenAi__MaxOutputTokens=900
          env_vars_update_strategy: overwrite
          secrets: |-
            Bot__Token=birthday-helper-telegram-token:latest
            Bot__WebhookSecretToken=birthday-helper-telegram-webhook-secret:latest
            Mongo__ConnectionString=birthday-helper-mongodb-uri:latest
            Scheduler__Secret=birthday-helper-scheduler-secret:latest
            OpenAi__ApiKey=birthday-helper-openai-api-key:latest
          secrets_update_strategy: overwrite
          wait: true
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --concurrency=20
            --timeout=60s
            --port=8080

      - name: Verify Cloud Run health
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          LATEST_READY_REVISION="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.latestReadyRevisionName)')"
          TRAFFIC="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.traffic[0].percent)')"

          echo "Cloud Run URL: ${SERVICE_URL}"
          echo "Latest ready revision: ${LATEST_READY_REVISION}"
          echo "Traffic to first target: ${TRAFFIC}%"
          echo "IAM policy:"
          gcloud run services get-iam-policy "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" || true

          echo "Root response:"
          curl --silent --show-error --include "${SERVICE_URL}/" || true

          echo "Health response:"
          curl --silent --show-error --include "${SERVICE_URL}/health" || true

          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "${SERVICE_URL}/health"

          echo "Readiness response (includes MongoDB):"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors "${SERVICE_URL}/health/ready"

      - name: Verify OpenAI API and structured output
        shell: bash
        run: |
          set -euo pipefail
          OPENAI_API_KEY="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="birthday-helper-openai-api-key")"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --output "${RESPONSE_FILE}" --write-out "%{http_code}" \
            --request POST "https://api.openai.com/v1/responses" \
            --header "Authorization: Bearer ${OPENAI_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"model":"gpt-6-luna","store":false,"reasoning":{"effort":"none"},"max_output_tokens":120,"instructions":"Return a JSON object with answer set to ok.","input":"Health check","text":{"verbosity":"low","format":{"type":"json_schema","name":"health_check","strict":true,"schema":{"type":"object","additionalProperties":false,"properties":{"answer":{"type":"string"}},"required":["answer"]}}}}')"
          unset OPENAI_API_KEY

          python3 - "${HTTP_CODE}" "${RESPONSE_FILE}" <<'PY'
          import json
          import sys

          status = int(sys.argv[1])
          with open(sys.argv[2], encoding="utf-8") as f:
              response = json.load(f)

          if status != 200:
              error = response.get("error") or {}
              print(f"OpenAI check failed (HTTP {status}): {error.get('type', 'unknown')} - {error.get('message', 'unknown')}")
              raise SystemExit(1)

          messages = [x for x in response.get("output", []) if x.get("type") == "message"]
          content = [part.get("text") for msg in messages for part in msg.get("content", []) if part.get("type") == "output_text"]
          if not content or json.loads(content[0]).get("answer") != "ok":
              print("OpenAI check failed: unexpected structured response.")
              raise SystemExit(1)

          print(f"OpenAI structured-response smoke test OK ({response.get('model', 'unknown')})")
          PY
          rm -f "${RESPONSE_FILE}"

      - name: Create or update reminder scheduler
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          SCHEDULER_SECRET="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="birthday-helper-scheduler-secret")"

          if gcloud scheduler jobs describe "${SCHEDULER_JOB}" --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${SCHEDULER_JOB}" --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" --schedule="* * * * *" --time-zone="UTC" --uri="${SERVICE_URL}/internal/reminders/run" --http-method="POST" --update-headers="X-BirthdayBot-Scheduler-Secret=${SCHEDULER_SECRET}" --attempt-deadline="60s" --quiet >/dev/null
          else
            gcloud scheduler jobs create http "${SCHEDULER_JOB}" --project="${GCP_PROJECT_ID}" --location="${GCP_REGION}" --schedule="* * * * *" --time-zone="UTC" --uri="${SERVICE_URL}/internal/reminders/run" --http-method="POST" --headers="X-BirthdayBot-Scheduler-Secret=${SCHEDULER_SECRET}" --attempt-deadline="60s" --quiet >/dev/null
          fi

      - name: Configure Telegram webhook
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          TELEGRAM_TOKEN="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="birthday-helper-telegram-token")"
          TELEGRAM_WEBHOOK_SECRET="$(gcloud secrets versions access latest --project="${GCP_PROJECT_ID}" --secret="birthday-helper-telegram-webhook-secret")"

          GETME_FILE="$(mktemp)"
          GETME_STATUS="$(curl --silent --show-error --output "${GETME_FILE}" --write-out "%{http_code}" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe")"

          if [[ "${GETME_STATUS}" != "200" ]]; then
            echo "Telegram token validation failed: getMe returned HTTP ${GETME_STATUS}."
            python3 -c 'import json,sys; p=sys.argv[1];\ntry:\n d=json.load(open(p,encoding="utf-8")); print(d.get("description","Telegram returned an error"))\nexcept Exception:\n print("Telegram returned a non-JSON error response")' "${GETME_FILE}"
            rm -f "${GETME_FILE}"
            exit 1
          fi

          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); b=d.get("result",{}); print("Telegram token valid for bot @"+b.get("username","<unknown>"))' "${GETME_FILE}"
          rm -f "${GETME_FILE}"

          WEBHOOK_FILE="$(mktemp)"
          WEBHOOK_STATUS="$(curl --silent --show-error --output "${WEBHOOK_FILE}" --write-out "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setWebhook" --data-urlencode "url=${SERVICE_URL}/telegram/webhook" --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}")"

          if [[ "${WEBHOOK_STATUS}" != "200" ]]; then
            echo "Telegram setWebhook failed with HTTP ${WEBHOOK_STATUS}."
            python3 -c 'import json,sys; p=sys.argv[1];\ntry:\n d=json.load(open(p,encoding="utf-8")); print(d.get("description","Telegram returned an error"))\nexcept Exception:\n print("Telegram returned a non-JSON error response")' "${WEBHOOK_FILE}"
            rm -f "${WEBHOOK_FILE}"
            exit 1
          fi

          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("ok") is True, d; print(d.get("description","Webhook configured"))' "${WEBHOOK_FILE}"
          rm -f "${WEBHOOK_FILE}"

      - name: Deployment summary
        run: |
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')"
          echo "Cloud Run URL: ${SERVICE_URL}"
          echo "Health: ${SERVICE_URL}/health"
          echo "Telegram webhook: ${SERVICE_URL}/telegram/webhook"
          echo "Reminder scheduler: ${SCHEDULER_JOB}"
