services:
  app:
    image: ${ACC_ID}.dkr.ecr.${REGION}.amazonaws.com/${ECR_REPO}:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks: [net]
    # Ждём readiness самого приложения
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Web UI for MongoDB (accessible at https://<DOMAIN>/mongo/)
  # Start manually: docker compose --profile tools up -d mongo-express
  # Stop:           docker compose --profile tools stop mongo-express
  mongo-express:
    profiles: ["tools"]
    image: mongo-express:1
    restart: unless-stopped
    env_file:
      - .env
    networks: [net]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [net]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    networks: [net]

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [net]

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.3.12
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [net]

volumes:
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}
  ollama_data: {}

networks:
  net: {}

